<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{width:var(--w);height:var(--h);background:#f5f5f7;position:relative;color:#1d1d1f}
.bar{position:absolute;inset:0 0 auto;height:28px;background:rgba(246,246,248,.9);border-bottom:1px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 16px;font-size:13px;font-weight:500}
.bar b{font-weight:700;margin-right:auto}
.mark{display:inline-flex;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.09)}
.copy{position:absolute;left:var(--pad);top:50%;transform:translateY(-45%)}
.copy img{width:var(--icon);height:var(--icon);filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));margin-bottom:14px}
h1{margin:0;font-size:var(--title);font-weight:700;letter-spacing:-.04em;line-height:.95}
p{margin:12px 0 0;font-size:var(--tag);color:#515154;max-width:18em;line-height:1.3}
.tiles{position:absolute;right:var(--pad);top:50%;transform:translateY(-45%);display:grid;grid-template-columns:repeat(3,var(--tile));gap:10px}
.t{height:var(--tile);border-radius:14px;display:grid;place-items:center;font-size:calc(var(--tile)*.42);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.t:nth-child(2){transform:translateY(-14px) rotate(3deg)}.t:nth-child(4){transform:rotate(-4deg)}.t:nth-child(6){transform:translateY(12px) rotate(4deg)}
</style></head><body>
<div class="bar"><b>Snicker</b><span class="mark"><svg viewBox="0 0 24 18" width="22" height="16"><defs><mask id="c" maskUnits="userSpaceOnUse" x="-12" y="-9" width="24" height="18"><rect x="-12" y="-9" width="24" height="18" fill="#fff"/><text x="0" y="0.4" text-anchor="middle" dominant-baseline="middle" font-family="system-ui" font-weight="900" font-size="6.8" fill="#000">GIF</text></mask></defs><rect x="-6.5" y="-4.5" width="13" height="9" rx="2.3" fill="#1d1d1f" fill-opacity=".45" transform="translate(13.4 6.9) rotate(-12)"/><g transform="translate(11.6 10.3) rotate(6)"><rect x="-7.5" y="-5" width="15" height="10" rx="2.3" fill="#1d1d1f" mask="url(#c)"/></g></svg></span><span>⌘⌥V</span></div>
<div class="copy"><img src="../assets/icon.png" alt=""><h1>Snicker</h1><p>The perfect reaction, one shortcut away.</p></div>
<div class="tiles">
<div class="t" style="background:#ffb800">😂</div><div class="t" style="background:#2f8cff">🙏</div><div class="t" style="background:#8e6cf2">🥳</div>
<div class="t" style="background:#30c35c">👍</div><div class="t" style="background:#ff8a00">🤯</div><div class="t" style="background:#ff2d78">❤️</div>
</div>
</body></html>
