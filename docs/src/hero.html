<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.desk{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 70% at 15% 85%,#ff7a3d 0,transparent 60%),
  radial-gradient(ellipse 55% 60% at 85% 20%,#6a4bff 0,transparent 60%),
  radial-gradient(ellipse 50% 60% at 60% 95%,#e0307a 0,transparent 60%),
  radial-gradient(ellipse 40% 40% at 35% 25%,#1e90ff 0,transparent 70%),
  #120d24}
.menubar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(20,16,36,.35);backdrop-filter:blur(20px) saturate(1.6);
  display:flex;align-items:center;padding:0 16px;color:#fff;font-size:13.5px;font-weight:600;gap:18px}
.menubar .apple{font-size:16px}
.menubar .dim{font-weight:400;opacity:.9}
.menubar .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-weight:500}
.gifbadge{border:1.6px solid #fff;border-radius:4px;font-family:inherit;font-weight:800;font-size:8.5px;line-height:1;padding:2px 3px;letter-spacing:.3px}
.gifwrap{padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.22)}
.pop{position:absolute;top:44px;left:836px;width:420px;height:560px;border-radius:26px;
  background:rgba(38,34,52,.52);backdrop-filter:blur(34px) saturate(1.8);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);padding:12px 10px 0;overflow:hidden;color:#fff}
.arrow{position:absolute;top:34px;left:1106px;width:22px;height:11px;background:rgba(60,54,78,.7);clip-path:polygon(50% 0,100% 100%,0 100%);backdrop-filter:blur(34px)}
.search{height:40px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
  display:flex;align-items:center;gap:9px;padding:0 14px;font-size:17px}
.search .mag{opacity:.6;display:flex}
.search .caret{width:2px;height:20px;background:#0a84ff;margin-left:-6px}
.search .x{margin-left:auto;opacity:.45;display:flex}
.chips{display:flex;gap:6px;margin:10px 0 8px;white-space:nowrap}
.chip{font-size:12px;font-weight:500;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.chip.on{background:#0a84ff;border-color:#3d9dff}
.grid{display:flex;gap:6px}
.col{flex:1;display:flex;flex-direction:column;gap:6px}
.t{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden}
.t::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 50%)}
.ring{box-shadow:0 0 0 2.5px #0a84ff inset}
.copied{position:absolute;z-index:2;font-size:14px;font-weight:600;padding:7px 13px;border-radius:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3)}
.dimmed::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:1}
.footer{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;padding:0 14px;font-size:11px;
  background:linear-gradient(0deg,rgba(38,34,52,.85),rgba(38,34,52,0));gap:8px}
.footer .hint{opacity:.62}.footer .klipy{margin-left:auto;opacity:.38}
.footer .dots{width:22px;height:22px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:-1px}
.copy{position:absolute;left:84px;top:210px;color:#fff;width:540px}
.copy h1{font-family:inherit;font-weight:800;font-size:76px;line-height:1;letter-spacing:-2px;margin:0 0 16px}
.copy p{font-size:24px;line-height:1.35;margin:0 0 30px;opacity:.86}
.keys{display:flex;gap:10px;align-items:center;font-size:18px;opacity:.9}
.key{min-width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 6px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;backdrop-filter:blur(10px)}
.icon{width:84px;height:84px;margin-bottom:22px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
</style></head><body>
