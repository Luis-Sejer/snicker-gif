<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
.icon{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;
  background:radial-gradient(circle at 25% 20%,#ffd36b 0,transparent 45%),linear-gradient(145deg,#ff9f0a 0%,#ff375f 50%,#bf5af2 100%);
  box-shadow:0 24px 48px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -8px 24px rgba(80,0,90,.25);overflow:hidden}
.icon::after{content:"";position:absolute;inset:0;border-radius:185px;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 42%)}
.card{position:absolute;border-radius:64px;display:flex;align-items:center;justify-content:center}
.back{left:203px;top:233px;width:420px;height:300px;background:rgba(255,255,255,.35);transform:rotate(-12deg);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.front{left:189px;top:297px;width:432px;height:300px;background:rgba(255,255,255,.94);transform:rotate(6deg);
  box-shadow:0 18px 40px rgba(90,0,60,.35),inset 0 -4px 0 rgba(0,0,0,.06)}
.front span{font:900 150px/1 -apple-system,"SF Pro Rounded","SF Pro Display",system-ui;letter-spacing:4px;
  background:linear-gradient(135deg,#ff6a2b,#e0307a 55%,#9b40e0);-webkit-background-clip:text;color:transparent}
</style></head><body><div class="icon"><div class="card back"></div><div class="card front"><span>GIF</span></div></div></body></html>
