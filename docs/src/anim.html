<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.desk{position:absolute;inset:0;background:#ff375f}
.menubar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(20,16,36,.35);backdrop-filter:blur(20px) saturate(1.6);
  display:flex;align-items:center;padding:0 16px;color:#fff;font-size:13.5px;font-weight:600;gap:18px}
.menubar .apple{font-size:16px}
.menubar .dim{font-weight:400;opacity:.9}
.menubar .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-weight:500}
.gifbadge{border:1.6px solid #fff;border-radius:4px;font-family:inherit;font-weight:800;font-size:8.5px;line-height:1;padding:2px 3px;letter-spacing:.3px}
.gifwrap{padding:3px 6px;border-radius:7px;background:rgba(255,255,255,.22)}
.pop{position:absolute;top:44px;left:836px;width:420px;height:560px;border-radius:26px;
  background:rgba(38,34,52,.52);backdrop-filter:blur(34px) saturate(1.8);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);padding:12px 10px 0;overflow:hidden;color:#fff}
.arrow{position:absolute;top:34px;left:1106px;width:22px;height:11px;background:rgba(60,54,78,.7);clip-path:polygon(50% 0,100% 100%,0 100%);backdrop-filter:blur(34px)}
.search{height:40px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
  display:flex;align-items:center;gap:9px;padding:0 14px;font-size:17px}
.search .mag{opacity:.6;display:flex}
.search .caret{width:2px;height:20px;background:#0a84ff;margin-left:-6px}
.search .x{margin-left:auto;opacity:.45;display:flex}
.chips{display:flex;gap:6px;margin:10px 0 8px;white-space:nowrap}
.chip{font-size:12px;font-weight:500;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.chip.on{background:#0a84ff;border-color:#3d9dff}
.grid{display:flex;gap:6px}
.col{flex:1;display:flex;flex-direction:column;gap:6px}
.t{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden}

.ring{box-shadow:0 0 0 2.5px #0a84ff inset}
.copied{position:absolute;z-index:2;font-size:14px;font-weight:600;padding:7px 13px;border-radius:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3)}
.dimmed::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:1}
.footer{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;padding:0 14px;font-size:11px;
  background:linear-gradient(0deg,rgba(38,34,52,.85),rgba(38,34,52,0));gap:8px}
.footer .hint{opacity:.62}.footer .klipy{margin-left:auto;opacity:.38}
.footer .dots{width:22px;height:22px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:-1px}
.copy{position:absolute;left:84px;top:210px;color:#fff;width:540px}
.copy h1{font-family:inherit;font-weight:800;font-size:76px;line-height:1;letter-spacing:-2px;margin:0 0 16px}
.copy p{font-size:24px;line-height:1.35;margin:0 0 30px;opacity:.86}
.keys{display:flex;gap:10px;align-items:center;font-size:18px;opacity:.9}
.key{min-width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 6px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;backdrop-filter:blur(10px)}
.icon{width:84px;height:84px;margin-bottom:22px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}

.pop,.arrow{transform-origin:50% 0}
.t{will-change:transform}
.t .e{display:inline-block}
.cursor{position:absolute;z-index:50;width:26px;height:34px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.key.down{transform:translateY(3px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.25);background:rgba(255,255,255,.26)}
.chat{position:absolute;top:60px;left:836px;width:420px;height:560px;border-radius:22px;overflow:hidden;color:#fff;
  background:rgba(28,26,40,.62);backdrop-filter:blur(34px) saturate(1.7);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.chat .head{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:600;font-size:15px}
.chat .head .dots{display:flex;gap:7px;margin-right:6px}.chat .head .dots i{width:12px;height:12px;border-radius:6px;background:#ff5f57}
.chat .head .dots i:nth-child(2){background:#febc2e}.chat .head .dots i:nth-child(3){background:#28c840}
.chat .head .ch{opacity:.55;font-weight:500}
.msgs{position:absolute;left:0;right:0;bottom:64px;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.bub{max-width:260px;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.35;background:rgba(255,255,255,.13)}
.msg.me .bub{background:#0a84ff}
.name{font-size:11px;opacity:.55;margin:0 0 3px 4px}
.gifbub{width:200px;height:150px;border-radius:16px;background:#ffb800;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;overflow:hidden}
.gifbub .tag{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.35)}
.compose{position:absolute;left:12px;right:12px;bottom:12px;height:40px;border-radius:20px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 16px;font-size:14px;opacity:.9}
.compose span{opacity:.45}
.paste{position:absolute;z-index:40;display:flex;gap:8px}

/* Light theme, matching the website: Apple's gray desktop, light glass, blue accents. */
.desk{background:#f5f5f7}
.menubar{background:rgba(246,246,248,.72);color:#1d1d1f;border-bottom:1px solid rgba(0,0,0,.1)}
.gifwrap{background:rgba(0,0,0,.09)}
.gifwrap svg rect{fill:#1d1d1f}
.copy{color:#1d1d1f}
.copy h1{font-weight:700}
.copy p{color:#515154;opacity:1}
.key{background:#fff;color:#1d1d1f;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -3px 0 rgba(0,0,0,.09),0 4px 10px rgba(0,0,0,.08)}
.key.down{background:#f2f2f4;box-shadow:inset 0 -1px 0 rgba(0,0,0,.09),0 1px 3px rgba(0,0,0,.08)}
.icon{filter:drop-shadow(0 10px 20px rgba(0,0,0,.2))}
.pop{background:rgba(255,255,255,.8);color:#1d1d1f;border:1px solid rgba(0,0,0,.08);box-shadow:0 24px 60px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06)}
.arrow{background:rgba(255,255,255,.9)}
.search{background:rgba(0,0,0,.05);border-color:transparent;box-shadow:none}
.search .x svg path{stroke:#fff}
.chip{background:rgba(0,0,0,.05);border-color:transparent;color:#1d1d1f}
.chip.on{background:#0071e3;border-color:#0071e3;color:#fff}
.footer{background:rgba(255,255,255,.92);border-top:1px solid rgba(0,0,0,.1);color:#6e6e73}
.footer .hint,.footer .klipy{opacity:1}
.footer .dots{background:rgba(0,0,0,.06)}
.chat{background:#fff;color:#1d1d1f;border:1px solid rgba(0,0,0,.08);box-shadow:0 24px 60px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06)}
.chat .head{border-bottom-color:rgba(0,0,0,.1)}
.bub{background:rgba(0,0,0,.05)}
.msg.me .bub{background:#0071e3;color:#fff}
.compose{background:rgba(0,0,0,.05);border-color:transparent;color:#6e6e73}
.cursor{filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
</style></head><body>
<div class="desk"></div>
<div class="menubar"><span class="apple"></span><span>Finder</span><span class="dim">File</span><span class="dim">Edit</span><span class="dim">View</span><span class="dim">Go</span><span class="dim">Window</span>
 <div class="right"><span class="gifwrap"><svg width="24" height="18" viewBox="0 0 24 18" style="display:block"><defs><mask id="cut" maskUnits="userSpaceOnUse" x="-12" y="-9" width="24" height="18"><rect x="-12" y="-9" width="24" height="18" fill="#fff"/><text x="0" y="0.4" text-anchor="middle" dominant-baseline="middle" font-family="system-ui" font-weight="900" font-size="6.8" letter-spacing=".2" fill="#000">GIF</text></mask></defs><rect x="-6.5" y="-4.5" width="13" height="9" rx="2.3" fill="#fff" fill-opacity=".45" transform="translate(13.4 6.9) rotate(-12)"/><g transform="translate(11.6 10.3) rotate(6)"><rect x="-7.5" y="-5" width="15" height="10" rx="2.3" fill="#fff" mask="url(#cut)"/></g></svg></span><span>Thu 24 Sep 13.37</span></div></div>
<div class="copy"><img class="icon" src="../assets/icon.png"><h1>Snicker</h1><p>The perfect reaction, one shortcut away. Search GIFs from your menu bar and paste them anywhere.</p>
 <div class="keys"><div class="key">⌘</div><div class="key">⌥</div><div class="key">V</div></div></div>
<div id="stage"></div>
<script>
const STAR_SVG=`<svg width="11" height="11" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
const MAG=`<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.6 10.6 14.5 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,XM=`<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="currentColor"/><path d="M5.3 5.3l5.4 5.4M10.7 5.3l-5.4 5.4" stroke="#2a2640" stroke-width="1.7" stroke-linecap="round"/></svg>`,CHK=`<svg width="15" height="15" viewBox="0 0 16 16" style="vertical-align:-2px;margin-right:5px"><circle cx="8" cy="8" r="7.5" fill="#fff"/><path d="M4.6 8.2l2.2 2.2 4.6-4.8" fill="none" stroke="#b86a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const t=parseFloat(new URLSearchParams(location.search).get('t')||'7.2');
const clamp=(x)=>Math.min(1,Math.max(0,x)), prog=(a,d)=>clamp((t-a)/d);
const easeOut=(x)=>1-Math.pow(1-x,3), easeInOut=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=(x)=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const TRENDING=[[['😂','#ffd60a','#ff7a00',104],['🙏','#64d2ff','#0a4bd6',150],['😎','#5e5ce6','#bf5af2',96],['💯','#ff453a','#8e1b4c',130]],
 [['👍','#30d158','#0a7d5a',132],['🤯','#ff9f0a','#c2410c',110],['❤️','#ff2d92','#6a1b9a',150]],
 [['👀','#bf5af2','#3a1c8c',96],['🙌','#34c759','#1d6f42',140],['😅','#0a84ff','#5e5ce6',110],['🫡','#ff9f0a','#ff375f',104]]];
const PARTY=[[['🎉','#ff9f0a','#ff375f',92],['🕺','#30d158','#0a7d5a',150],['🥳','#5e5ce6','#bf5af2',100],['🍾','#ff453a','#8e1b4c',130]],
 [['🪩','#64d2ff','#0a4bd6',140],['😂','#ffd60a','#ff7a00',104],['💃','#ff2d92','#6a1b9a',160]],
 [['🎊','#bf5af2','#3a1c8c',110],['🙌','#34c759','#1d6f42',96],['🔥','#ff9f0a','#c2410c',140],['🎈','#0a84ff','#5e5ce6',100]]];
// Beats of the 15s timeline; render.sh times the sound effects and voiceover to the same moments.
const OPEN_AT=1.0, TRENDING_AT=1.2, TYPE_AT=3.7, SWAP_AT=4.7, POINT_AT=5.4, CLICK_AT=6.8, CLOSE_AT=8.0, CHAT_AT=8.4, KEYS_AT=9.0, PASTE_AT=9.8, REPLY_AT=11.0, OUT_AT=13.8, END=15;
const stage=document.getElementById('stage');
// keycaps press as the shortcut fires
document.querySelectorAll('.key').forEach((k,i)=>{ if(t>=0.5+i*0.1&&t<1.05) k.classList.add('down') });
const party=t>=SWAP_AT, set=party?PARTY:TRENDING, setStart=party?SWAP_AT:TRENDING_AT;
const query='party'.slice(0,Math.max(0,Math.min(5,Math.floor((t-TYPE_AT)/0.16)+1)));
const caret=(t>=TYPE_AT&&t<TYPE_AT+0.9)||Math.floor(t*2)%2===0;
if(t>=OPEN_AT&&t<CLOSE_AT+0.3){
  const o=back(prog(OPEN_AT,0.4)), c=easeOut(prog(CLOSE_AT,0.25));
  const sc=(0.9+0.1*o)*(1-0.05*c), op=clamp(o*1.4)*(1-c);
  let tiles='', n=0;
  set.forEach((col,ci)=>{ tiles+='<div class="col">'; col.forEach((g,ri)=>{
    const p=easeOut(prog(setStart+(n++)*0.035,0.3)), bob=Math.sin((t*5)+n)*4, rot=Math.sin(t*4+n*1.7)*6;
    const target=party&&ci===1&&ri===1, hover=target&&t>=POINT_AT+0.85, copied=target&&t>=CLICK_AT;
    const hs=hover?1.04:1;
    tiles+=`<div class="t${copied?' dimmed':''}${ci===0&&ri===0&&party?' ring':''}" id="${target?'target':''}" style="height:${g[3]}px;background:${g[1]};opacity:${p};transform:translateY(${(1-p)*12}px) scale(${(0.95+0.05*p)*hs});${hover?'z-index:3;box-shadow:0 10px 24px rgba(0,0,0,.35);':''}"><span class="e" style="transform:translateY(${bob}px) rotate(${rot}deg)">${g[0]}</span>${hover&&!copied?`<span style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;z-index:3">${STAR_SVG}</span>`:''}${copied?`<span class="copied" style="transform:scale(${back(prog(CLICK_AT,0.3))})">${CHK}Copied</span>`:''}</div>`;
  }); tiles+='</div>' });
  const chip=(label,on)=>`<span class="chip${on?' on':''}">${label}</span>`;
  stage.innerHTML+=`<div class="arrow" style="left:1106px;opacity:${op}"></div>
  <div class="pop" style="opacity:${op};transform:scale(${sc})">
   <div class="search"><span class="mag">${MAG}</span>${query?`<span>${query}</span>`:'<span style="opacity:.45">Search KLIPY</span>'}${caret?'<span class="caret"'+(query?'':' style="margin-left:-98px"')+'></span>':''}${query?`<span class="x">${XM}</span>`:''}</div>
   <div class="chips">${chip('⭐ Favorites')}${chip('🕘 Recent')}${chip('🔥 Trending',!query)}${(query.length>=3?['party time','party hard','party animal']:['Thank you','LOL','Yes','Party']).map(c=>chip(c)).join('')}</div>
   <div class="grid">${tiles}</div>
   <div class="footer"><span class="hint">⏎ copy · ⇧⏎ link · ⌘D favorite</span><span class="klipy">Powered by KLIPY</span><span class="dots">•••</span></div>
  </div>`;
}
if(t>=POINT_AT&&t<CLOSE_AT+0.1){
  const tr=document.getElementById('target').getBoundingClientRect();
  const m=easeInOut(prog(POINT_AT,0.9)), x=1215+(tr.left+tr.width*0.55-1215)*m, y=700+(tr.top+tr.height*0.6-700)*m;
  const press=t>=CLICK_AT-0.05&&t<CLICK_AT+0.12?0.85:1;
  stage.innerHTML+=`<svg class="cursor" viewBox="0 0 26 34" style="left:${x}px;top:${y}px;transform:scale(${press});transform-origin:0 0"><path d="M3 2 L3 26 L9 20.5 L13 30 L17 28.3 L13.2 19 L21.5 19 Z" fill="#000" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
if(t>=CHAT_AT){
  const i=easeOut(prog(CHAT_AT,0.5)), out=easeOut(prog(OUT_AT,END-OUT_AT));
  const gp=back(prog(PASTE_AT,0.4)), rp=easeOut(prog(REPLY_AT,0.3));
  const bob=Math.sin(t*5)*5, rot=Math.sin(t*4)*7;
  stage.innerHTML+=`<div class="chat" style="opacity:${i*(1-out)};transform:translateY(${(1-i)*24+out*10}px)">
   <div class="head"><span class="dots"><i></i><i></i><i></i></span># design-team <span class="ch">· 6 members</span></div>
   <div class="msgs">
    <div class="msg"><div class="av" style="background:#bf5af2">M</div><div><div class="name">Maja</div><div class="bub">The new onboarding flow just shipped 🚀</div></div></div>
    <div class="msg"><div class="av" style="background:#30d158">J</div><div><div class="name">Jonas</div><div class="bub">Party time?</div></div></div>
    ${t>=PASTE_AT?`<div class="msg me" style="opacity:${clamp(gp)};transform:scale(${0.8+0.2*gp});transform-origin:100% 100%"><div class="gifbub"><span class="e" style="display:inline-block;transform:translateY(${bob}px) rotate(${rot}deg)">😂</span><span class="tag">GIF</span></div></div>`:''}
    ${t>=REPLY_AT?`<div class="msg" style="opacity:${rp};transform:translateY(${(1-rp)*8}px)"><div class="av" style="background:#bf5af2">M</div><div><div class="bub">haha perfect 😂</div></div></div>`:''}
   </div>
   <div class="compose"><span>Message #design-team</span></div>
  </div>`;
  if(t>=KEYS_AT&&t<PASTE_AT+0.5){
    const k=easeOut(prog(KEYS_AT,0.25))*(1-prog(PASTE_AT+0.2,0.3)), down=t>=KEYS_AT+0.4&&t<PASTE_AT+0.1;
    stage.innerHTML+=`<div class="paste" style="left:994px;top:230px;opacity:${k}"><div class="key${down?' down':''}">⌘</div><div class="key${t>=KEYS_AT+0.5&&t<PASTE_AT+0.1?' down':''}">V</div></div>`;
  }
}
</script></body></html>
