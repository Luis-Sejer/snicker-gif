name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.sh reads the version from the tag

      - name: Import the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          # The same certificate every release, or macOS drops Snicker's Accessibility permission on each update.
          test -n "$SIGNING_CERT_P12" || { echo "::error::The SIGNING_CERT_P12 secret is not set"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build
        env:
          SNICKER_KLIPY_KEY: ${{ secrets.KLIPY_API_KEY }}
          SNICKER_SIGNING_IDENTITY: Snicker
        run: |
          # Public downloads must work out of the box, so never publish a build without a key.
          test -n "$SNICKER_KLIPY_KEY" || { echo "::error::The KLIPY_API_KEY secret is not set"; exit 1; }
          ./build.sh
          ditto -c -k --keepParent build/Snicker.app build/Snicker.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # build.sh already bundled this version's CHANGELOG section as the app's What's New.
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" build/Snicker.zip --title "Snicker $VERSION" --notes-file build/Snicker.app/Contents/Resources/whats-new.md
