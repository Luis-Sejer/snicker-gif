name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.sh reads the version from the tag

      - name: Build
        env:
          SNICKER_KLIPY_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          # Public downloads must work out of the box, so never publish a build without a key.
          test -n "$SNICKER_KLIPY_KEY" || { echo "::error::The KLIPY_API_KEY secret is not set"; exit 1; }
          ./build.sh
          ditto -c -k --keepParent build/Snicker.app build/Snicker.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md.
          VERSION=${GITHUB_REF_NAME#v}
          awk -v version="$VERSION" '/^## \[/ { inside = index($0, "[" version "]") > 0; next } inside' CHANGELOG.md > build/notes.md
          gh release create "$GITHUB_REF_NAME" build/Snicker.zip --title "Snicker $VERSION" --notes-file build/notes.md
